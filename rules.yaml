# ElderCare rules. Zones are polygons in normalised 0-1 image coordinates (x right, y down).
# Run `python scripts/zone_helper.py <video>` for a first frame with a 10% grid to read coordinates from.
# Zones are per camera: videos/<name>.yaml for examples, `rules:` per camera in cameras.yaml.
sample_fps: 6
imgsz: 640
det_conf: 0.15            # person detection threshold; people lying on the floor score low with COCO pose models
clock_start: "09:00:00"   # clock time at the start of a clip (override per camera or with --clock)
face_blur: false

posture:                  # degrees from vertical / box ratios, see app/posture.py
  lying_torso: 60
  lying_aspect: 1.4
  lying_min_aspect: 0.9
  bend_torso: 30
  sit_thigh: 50
  sit_thigh_ratio: 0.5
  legs_hidden: standing   # knees out of view: standing (counter); set sitting per camera for tables/sofas

tracks:
  dedupe_cover: 0.6       # drop a detection this much inside a more confident one (duplicate partial boxes)
  min_samples: 12         # drop tracks seen for less than ~2 s (passers-by, false positives)
  smooth_window: 5        # posture majority vote, in samples
  rejoin_gap_s: 3.0       # re-join a broken ID if it reappears within this gap...
  rejoin_dist_bl: 1.0     # ...and within this many body lengths (+ running speed x gap) of where it vanished
  speed_window_s: 1.0
  walk_bh_per_s: 0.35     # foot-point speed in body heights per second
  run_bh_per_s: 1.5

fall:
  window_s: 2.0           # upright -> lying within this time
  hip_drop_frac: 0.25     # hips drop at least this fraction of body height...
  height_ratio: 0.7       # ...or the box shrinks to this fraction of its upright height (high cameras)
  floor_drop_frac: 0.6    # or, without 'lying': hips drop this many body heights...
  floor_window_s: 1.0     # ...this fast (a fall towards the camera reads as sitting)
  settle_s: 0.5           # judge the lying drop over this first stretch (at 6 fps the first lying frame is mid-fall)
  min_down_s: 5.0         # and stay down at least this long (tuned: sinking into a sofa is up in ~3 s)
  vanish_s: 3.0           # or: the body drops, then nobody is seen for this long (lying people are often missed)
  vanish_min_aspect: 1.2  # the last-seen box must be wide (on the floor), not upright (walked behind furniture)
  collapse_frac: 0        # or (OFF; 0.45 in a camera's rules file enables it): whatever the posture says, the box
  collapse_window_s: 1.0  # top drops this many body heights this fast, feet put (falls ending seated, GUIDE §7)

lying_outside_rest_s: 120
stillness:
  min_s: 300              # barely moving for this long
  move_bl: 0.15           # "barely" = within this many body lengths

live:                     # live cameras (cameras.yaml) use these instead of the upload values above
  no_recovery_s: 30       # fall, then still down this long -> FALL ALERT pushed to the family
  lying_outside_rest_s: 60
  stillness_s: 300

zones: []                 # none by default; per camera/clip in its own file (see videos/*.yaml)
